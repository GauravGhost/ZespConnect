<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zesp Connect</title>
    <script>
      // Pre-paint guard: apply the persisted color mode before React mounts so
      // there is no light -> dark flash. Palette tokens are applied by the
      // ThemeProvider from src/app/theme/presets.ts.
      (function () {
        try {
          var mode = "system";
          var stored = localStorage.getItem("zesp-connect-ui");
          if (stored) mode = JSON.parse(stored).state.themeMode || mode;
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
