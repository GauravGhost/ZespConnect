[package]
name = "zesp-connect"
version = "0.1.1"
license = "MIT"
repository = "https://github.com/GauravGhost/ZespConnect"
description = "Zesp Connect - manage Android devices over adb and scrcpy"
edition = "2021"

[lib]
# Distinct from the bin name, which would clash on Windows (rust-lang/cargo#8519).
name = "zesp_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "sync",
    "fs",
] }
once_cell = "1"
regex = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
futures-util = "0.3"
zip = "2"
tar = "0.4"
flate2 = "1"
base64 = "0.22"
# The computer's clipboard for two-way clipboard sync (text only).
arboard = { version = "3", default-features = false }
cpal = "0.18"
mdns-sd = "0.21.7"
h264-reader = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
